name: Monthly Breakout Screener
on:
  schedule:
    # 17:00 IST = 11:30 UTC, Monday-Friday
    - cron: "27 11 * * 1-5"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols (leave blank for full F&O universe)"
        required: false
        default: ""
      only_breakouts:
        description: "Only include rows with a breakout in the spreadsheet"
        required: false
        default: "false"

permissions:
  contents: write   # needed to commit state/breakout_state.csv back to the repo

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener and send email
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          ARGS="--out output --state-file state/breakout_state.csv"
          if [ -n "${{ github.event.inputs.symbols }}" ]; then
            ARGS="$ARGS --symbols ${{ github.event.inputs.symbols }}"
          fi
          if [ "${{ github.event.inputs.only_breakouts }}" == "true" ]; then
            ARGS="$ARGS --only-breakouts"
          fi
          python monthly_breakout_screener.py $ARGS

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-breakout-screener-result
          path: output/*.xlsx
          retention-days: 30

      - name: Commit updated breakout state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/breakout_state.csv
          if git diff --cached --quiet; then
            echo "No change in breakout state — nothing to commit."
          else
            git commit -m "Update breakout state $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
